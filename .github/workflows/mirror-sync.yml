name: 从 Gitee 同步镜像

# GitHub 为从站：主源 Gitee（国内更新、打 tag），本工作流把 refs 单向镜像到 GitHub。
#
# 为什么不手工推：本机到 github.com:443 长期不稳，改用 GitHub 自己的网络来拉。
#
# 同步内容：refs（全部分支与 tag，push --mirror，主源删除也跟随删除）。
# 不搬 Release：安装包由 release.yml 在 GitHub 上直接构建，本来就是 GitHub 原生产物。
#
# 自举说明：mirror job 的逻辑内嵌于此（不调 scripts/），因为本文件首次进入空仓时
# 仓库里还没有任何脚本。push --mirror 完成后，Gitee 侧同一份文件成为权威副本。
# 由 GITHUB_TOKEN 发起的 push 不会递归触发 workflow（GitHub 官方行为）。
on:
  schedule:
    - cron: '17 */3 * * *'   # 每 3 小时一次（UTC，避开整点）
  workflow_dispatch:          # 重建仓库或临时需要时手工触发

permissions:
  contents: write
# 注意：job 级 permissions 没有 workflows 键——GITHUB_TOKEN 按 GitHub 安全设计永远不能
# 增改 workflow 文件，而 push --mirror 会写入历史中的 .github/workflows/*.yml。
# 故推送凭证改用 secret MIRROR_PAT（一个带 repo + workflow scope 的 PAT / OAuth token）。

concurrency:
  group: mirror-sync
  cancel-in-progress: false   # mirror 推送中途被取消可能留下半截 refs

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 推送镜像（Gitee 主 → AtomGit 备 → GitHub 从）
        env:
          MIRROR_PAT: ${{ secrets.MIRROR_PAT }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          SRC_LABEL=""
          SRC_URL=""
          for entry in \
            "Gitee|https://gitee.com/westanke/dsh-desktop.git" \
            "AtomGit|https://atomgit.com/westanke163/dsh-desktop.git"; do
            label="${entry%%|*}"; url="${entry#*|}"
            echo "探测源站：$label"
            if git ls-remote --heads "$url" >/dev/null 2>&1; then
              SRC_LABEL="$label"; SRC_URL="$url"
              echo "$label 可达，选作本次同步源"
              break
            fi
            echo "$label 不可达，尝试下一个源"
          done
          if [ -z "$SRC_URL" ]; then
            echo "::error::Gitee 与 AtomGit 均不可达，本次跳过"
            exit 1
          fi
          git clone --mirror "$SRC_URL" "$WORK/mirror.git"
          cd "$WORK/mirror.git"
          : "${MIRROR_PAT:?仓库 secret MIRROR_PAT 未配置（需带 repo + workflow scope 的 PAT）}"
          git remote set-url --push origin "https://x-access-token:${MIRROR_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          # 判据是**退出码**，不是输出文本
          if git push --mirror origin; then
            echo "✅ 镜像完成（源：$SRC_LABEL）"
          else
            echo "::error::镜像推送失败（源：$SRC_LABEL）"
            exit 1
          fi

  # 方向相反的一条：产物是 GitHub 建的，主源 Gitee 上得有得下。
  # 平时由 release.yml 在发版时当场搬；这里是定时补缺（例如那次没配 GITEE_TOKEN）。
  releases:
    needs: mirror              # 先有 refs，才谈得上认 tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 把 Release 搬到 Gitee
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: westanke/dsh-desktop
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 secret GITEE_TOKEN，跳过 Release 同步"
            exit 0
          fi
          TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 \
                   --json tagName -q '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$TAG" ]; then
            echo "还没有 Release，本次跳过"
            exit 0
          fi
          echo "▸ 同步 $TAG 到 Gitee 发行版"
          python3 scripts/ci/sync-release-to-gitee.py --tag "$TAG"
