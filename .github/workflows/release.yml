name: 打安装包

# 在 GitHub 的机器上现场构建三份产物，不依赖任何本机环境：
#   · Linux amd64 → deb
#   · Linux arm64 → deb（arm64 机器上原生构建，交叉编译 jpackage 不可行）
#   · Windows x64 → 免安装 zip（镜像里有 WiX 时另出 msi）
#
# 触发：
#   · push tag v*  → 构建 + 建 GitHub Release 并上传资产
#   · 手工 dispatch → 只构建，产物留在 Actions 的 artifact 里（用来在打 tag 前先验一遍）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Linux amd64 ────────────────────────────────────────────────────────
  linux-amd64:
    name: deb · amd64
    # 用 22.04 而不是 24.04：构建机的 glibc 决定 jpackage 运行时镜像能跑多老的系统，
    # 目标用户里有 UOS 20（Debian 10 底子，glibc 2.28），越老的构建机兼容面越宽。
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 准备平台运行时（skiko linux-x64）
        run: bash tools/fetch-platform.sh linux-x64

      - name: 编译并打 deb
        run: bash tools/package.sh

      - name: 校验
        run: |
          set -euo pipefail
          ls -lh dist/
          # 注意：不要 `dpkg-deb -c … | grep -q`，grep 命中即关闭管道，
          # 上游 tar 收到 EPIPE 会报 "tar: stdout: write error" 并让整条流水线判红。
          dpkg-deb -I dist/*.deb
          contents="$(dpkg-deb -c dist/*.deb)"
          grep -q 'usr/share/applications/dsh-desktop.desktop' <<< "$contents"
          echo "✓ 包内桌面入口就位"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-amd64
          path: dist/*.deb
          if-no-files-found: error

  # ── Linux arm64 ────────────────────────────────────────────────────────
  linux-arm64:
    name: deb · arm64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 确认机器确实是 arm64
        run: test "$(uname -m)" = "aarch64" && echo "✓ aarch64"

      - name: 准备平台运行时（skiko linux-arm64）
        # lib/ 里入库的只有 x64 那份，arm64 必须现场拉
        run: bash tools/fetch-platform.sh linux-arm64

      - name: 编译并打 deb
        env:
          TARGET_PLATFORM: linux-arm64
        run: bash tools/package.sh

      - name: 校验
        run: |
          set -euo pipefail
          ls -lh dist/
          # 同上：先整体取回再判断，避免 grep -q 提前关管道把 dpkg-deb 打成失败
          info="$(dpkg-deb -I dist/*.deb)"
          contents="$(dpkg-deb -c dist/*.deb)"
          grep -q 'Architecture: arm64' <<< "$info"
          grep -q 'skiko-awt-runtime-linux-arm64' <<< "$contents"
          grep -q 'usr/share/applications/dsh-desktop.desktop' <<< "$contents"
          echo "✓ 架构与桌面入口都对"

      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/*.deb
          if-no-files-found: error

  # ── Windows x64 ────────────────────────────────────────────────────────
  windows-x64:
    name: zip · windows-x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 编译与打包逻辑和 UOS 共用同一份 bash 脚本（Git Bash 自带 bash / cygpath / curl）
      - name: 准备平台运行时（skiko windows-x64）
        shell: bash
        run: bash tools/fetch-platform.sh windows-x64

      - name: 编译并打包
        shell: bash
        run: bash tools/package.sh

      - name: 校验
        shell: bash
        # 不用 unzip：Git Bash 的镜像里不一定带它，Python 一定有。
        # PYTHONUTF8 必须显式给：Windows 控制台不是 UTF-8，打印 ✓ 会 UnicodeEncodeError。
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          ls -lh dist/
          python - <<'PY'
          import glob, zipfile, sys
          hits = glob.glob("dist/dsh-desktop-*-windows-x64.zip")
          if not hits:
              sys.exit("✗ 没找到 Windows zip")
          names = zipfile.ZipFile(hits[0]).namelist()
          assert any(n.endswith("dsh-desktop.exe") for n in names), "zip 里没有主程序"
          print("✓ zip 里有主程序")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: warn

  # ── 汇总发布 ───────────────────────────────────────────────────────────
  publish:
    name: 发布 Release
    needs: [linux-amd64, linux-arm64, windows-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          set -euo pipefail
          cd dist
          ls -lh
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: 建 Release 并上传
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "DSH Desktop $TAG" \
              --generate-notes \
              ./*
          fi
          echo "✓ 已发布 $TAG"

      # Gitee 是主源，但产物是这里建的——不搬回去，国内用户打开仓库会看到
      # "代码齐全、没东西可下"。--local 直接用刚上传的那份，不用再下载一遍。
      - name: 同步到 Gitee 发行版
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: westanke/dsh-desktop
          TAG: ${{ github.ref_name }}
          PYTHONUTF8: '1'
        run: |
          set -euo pipefail
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::warning::未配置 secret GITEE_TOKEN，跳过 Gitee 发行版同步"
            exit 0
          fi
          # 只警告不判红：GitHub 这边 Release 已经发布成功，Gitee 上可能还差这个 tag
          # （tag 是主源那边打的，要等 mirror-sync 搬过来）。缺了的话定时任务会补上。
          if ! python3 scripts/ci/sync-release-to-gitee.py --tag "$TAG" --local dist; then
            echo "::warning::Gitee 发行版同步未成功，将由定时任务补发"
          fi
